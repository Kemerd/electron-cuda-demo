<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Same strict CSP as index.html, and the same reasoning: everything this
      page runs is bundled by vite and served from the file:// origin, so 'self'
      covers scripts outright. style-src keeps 'unsafe-inline' because the HUD
      writes inline style properties (the sparkline sizing, metric visibility)
      the same way the in-page card does. No inline <script> exists here either.

      connect-src is 'none' rather than 'self': this page talks to the main
      process over contextBridge and has no reason to open a network connection
      of any kind. Tightening it costs nothing and removes a whole class of
      exfiltration from a window that renders relayed input.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self';
        connect-src 'none';
        object-src 'none';
        base-uri 'none';
        form-action 'none';
        frame-ancestors 'none';
      "
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoSwarm HUD</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>

  <body>
    <!--
      The whole page is the native rect: this window is sized and positioned to
      exactly the box the CUDA surface occupies (overlay-window.ts converts the
      client rect to screen coordinates). So the body is transparent, and the
      only things that paint are the two HUD cards positioned in its corners.

      #hud-root captures pointer/wheel input across the entire surface and
      relays it to the main renderer's camera rig -- the child HWND would
      otherwise eat every mouse event over the scene (CONTRACTS section 6).
      The cards sit above it and stop propagation, so hovering a readout does
      not orbit the globe behind it.
    -->
    <div id="hud-root" class="hud-root">
      <!-- Scene title + one-line description, top-left. Mirrors the stage topbar. -->
      <section id="scene-chip" class="scene-chip" aria-label="Scene">
        <h1 id="scene-title" class="scene-title">GeoSwarm</h1>
        <p id="scene-subtitle" class="scene-subtitle"></p>
      </section>

      <!-- FPS / GPU card, top-right. Same markup the in-page overlay builds. -->
      <section id="fps-overlay" class="glass-card fps-card" aria-label="Performance"></section>
    </div>

    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
